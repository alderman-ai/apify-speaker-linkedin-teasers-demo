<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="">
  <!-- Static footer icon for every generated card.
       Apify's registration cross, traced from the template's corner marks
       (32x32, ~28% arm thickness), recoloured to the actor card's muted grey.
       Disc sits on the card shell colour so only the cross and the CSS
       border ring read. -->
  <circle cx="20" cy="20" r="20" fill="#1d1d1d"/>
  <g fill="#a3a3a3">
    <rect x="6.5"  y="16.25" width="27" height="7.5" />
    <rect x="16.25" y="6.5"  width="7.5" height="27" />
  </g>
</svg>
