<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>speaker-card render</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* ==========================================================================
   RENDER SHELL — one finished 1200x1200 composition per generated page.
   The skill fills every double-brace token (image tokens take file:/// URLs
   or data: URIs), saves the result as _run-<name>.html IN THIS FOLDER so the
   ../fonts/ stylesheet resolves, and screenshots it with headless Chrome.

   Card CSS is the pixel-verified reproduction of apify.com's ActorStoreItem
   (384x153.667 at native width; every box matched live to 0.001px).
   Do not "clean up" the oddities — they are load-bearing:
     - no border property: the #1d1d1d shell + 2px padding IS the border
     - .icon is display:inline so the header row is 47.667px, not 40px
     - stats row is row-reverse: DOM [level][divider][duration] paints
       duration (mins) | divider | level

   The speaker portrait renders as a second component (.SpeakerCard):
   a #454545 shell that IS the border — square photo inset 16px on
   left/top/right, "Join me in PRAGUE" centred in the grey strip below
   at 80%-width ink — rendered 1:1 ({{SPK_SCALE}}); see its comment.
   ========================================================================== */

:root{
  --bg:          #020202;
  --bg-subtle:   #1d1d1d;
  --text:        #dfdfdf;
  --text-muted:  #a3a3a3;
  --text-subtle: #888888;
  --border:      #2a2a2a;
  --card-css-width: {{CARD_CSS_WIDTH}}px;
}

html,body{ margin:0; padding:0; }
body{ width:{{PAGE_W}}px; height:{{PAGE_H}}px; overflow:hidden;
      background:var(--bg); position:relative; }

/* base template, drawn first, full bleed */
#base{ position:absolute; left:0; top:0;
       width:{{PAGE_W}}px; height:{{PAGE_H}}px; display:block; }

/* speaker card, covering the green block (operator layout, 2026-09-01):
   rendered 1:1 (SPK_SCALE 1) at the block's own output size, spanning
   from the top of the upper central orange cross to the bottom of the
   lower one, centred on the header's right title box. The #454545
   (button-grey) shell IS the border: the portrait sits inset 16px on
   the LEFT, TOP and RIGHT; the remaining grey strip below holds only
   "Join me in PRAGUE" (PRAGUE in the crosses' orange #f5641f), its ink
   spanning 80% of the strip's width (width governs; measured 25.789px
   at Inter 500 for the current 294-wide element), centred both axes.
   Radii scale with the element (outer 15px / photo 11.3px = the
   approved 18/13.5 look at this element's 0.84 size factor). No outer
   ring. Re-measure the font/radii if the element is ever resized. */
#spkmount{ position:absolute; left:{{SPK_X}}px; top:{{SPK_Y}}px;
           width:{{SPK_W}}px; height:{{SPK_H}}px; }
#spkmount .SpeakerCard{ transform:scale({{SPK_SCALE}}); transform-origin:top left; }
.SpeakerCard{
  box-sizing:border-box;
  width:{{SPK_CSS_W}}px; height:{{SPK_CSS_H}}px;
  display:flex; flex-direction:column;
  padding:16px 16px 0 16px; border-radius:15px;
  background:#454545;
  font-family:Inter,sans-serif;
}
.SpeakerCard-photo{
  width:calc({{SPK_CSS_W}}px - 32px); height:calc({{SPK_CSS_W}}px - 32px);
  border-radius:11.3px; object-fit:cover; display:block;
  background:var(--bg);
  /* the input contract requires the photo at the slot's exact rendered
     square size, so cover crops nothing; it only guards a stray asset */
}
.SpeakerCard-bar{
  flex-grow:1;
  display:flex; align-items:center; justify-content:center;
  font-size:25.789px; line-height:1; font-weight:500; color:var(--text);
  white-space:nowrap;
}
.SpeakerCard-bar .prague{ color:#f5641f; }
  /* no vertical nudge on the text: measured on the render, plain flex
     centering already puts the ink centre within 0.1px of the strip's */

/* card mount: card renders at its native CSS width, then scales into the
   purple block. transform keeps type at production metrics. NOT a flex
   container — the card must never be able to shrink. */
#cardmount{ position:absolute; left:{{CARD_X}}px; top:{{CARD_Y}}px;
            width:{{CARD_W}}px; height:{{CARD_H}}px; }
#cardmount .ActorCard{ transform:scale({{CARD_SCALE}}); transform-origin:top left; }

/* ---------------- the card, verbatim from the verified extraction -------- */
.ActorCard{
  box-sizing:border-box;
  width:var(--card-css-width);
  display:flex; flex-direction:column; align-items:normal; gap:2px;
  padding:2px;
  border-radius:8px;
  background:var(--bg-subtle);
  color:var(--text);
  position:relative;
  font-family:Inter,sans-serif;
  text-decoration:none;
  font-size:18px; line-height:28px;   /* -> 47.667px header row, see top note */
  /* hover state rendered permanently on (operator direction): the live
     card's :hover ring — box-shadow 0 0 0 2px #2a2a2a OUTSIDE the card,
     so the edge reads ring / #1d1d1d shell / body, like a hovered card. */
  box-shadow:0 0 0 2px var(--border);
}
.ActorCard *{ box-sizing:border-box; }
.ActorCard-body{
  padding:16px; border-radius:6px; background-color:var(--bg); flex-grow:1;
}
.ActorCard-header{ display:flex; align-items:center; gap:12px; }
.ActorCard-iconWrap{ position:relative; display:inline-block; flex-shrink:0; }
.ActorCard-icon{
  display:inline;                      /* deliberately not block */
  width:40px; height:40px;
  border:1px solid var(--border); border-radius:8px;
  background-color:#f3f3f3;
  object-fit:cover; overflow:hidden;
}
.ActorCard-titleWrap{ overflow:hidden; display:flex; flex-direction:column;
                      justify-content:center; min-width:0; }
.ActorCard-title{
  margin:0; font-size:14px; line-height:20px; font-weight:600;
  color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ActorCard-slug{
  margin:0;
  font-family:"IBM Plex Mono",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:12px; line-height:16px; font-weight:500;
  color:var(--text-subtle);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ActorCard-desc{
  margin:8px 0 0;
  font-size:12px; line-height:16px; font-weight:400;
  color:var(--text-muted);
  overflow:hidden; text-overflow:ellipsis;
  display:-webkit-box; -webkit-line-clamp:{{DESC_LINES}};
  line-clamp:{{DESC_LINES}}; -webkit-box-orient:vertical;
}
.ActorCard-info{
  width:100%; padding:4px 8px;
  display:flex; justify-content:space-between; gap:4px;
}
.ActorCard-author{ display:flex; align-items:center; gap:4px; overflow:hidden; }
.ActorCard-authorAvatar{
  display:block; width:20px; height:20px;
  /* operator direction 2026-08-31: the footer icon is an orange ? in a
     circle with a 1px ORANGE border - this border IS that ring; the ?
     itself lives in the static footer-help-icon.svg */
  border:1px solid #f5641f; border-radius:100%;
  object-fit:cover; flex-shrink:0;
}
.ActorCard-authorName{
  margin:0; font-size:12px; line-height:16px; font-weight:500;
  color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ActorCard-stats{ display:flex; flex-direction:row-reverse; gap:8px;
                  align-items:center; flex-shrink:0; }
.ActorCard-stat{ color:var(--text-muted); display:flex; align-items:center;
                 gap:4px; font-size:12px; line-height:16px; font-weight:500; }
.ActorCard-stat p{ margin:0; }
.ActorCard-stat p:empty{ display:none; }
.ActorCard-stat svg{ width:12px; height:12px; overflow:hidden; }
.ActorCard-statDivider{ height:8px; width:1px; background-color:var(--bg-subtle); }
</style>
</head>
<body>

<img id="base" src="{{BASE_IMAGE_URI}}" alt="">

<!-- plate under the speaker card: covers the whole green block (its square
     corners would otherwise peek past the card's rounded corners) -->
<div id="spkplate" style="position:absolute;
     left:calc({{SPK_X}}px - 1px); top:calc({{SPK_Y}}px - 1px);
     width:calc({{SPK_W}}px + 2px); height:calc({{SPK_H}}px + 2px);
     background:#000"></div>
<div id="spkmount">
<div class="SpeakerCard">
  <img class="SpeakerCard-photo" src="{{SPEAKER_IMAGE_URI}}" alt="">
  <div class="SpeakerCard-bar"><span class="txt">Join me in <span class="prague">PRAGUE</span></span></div>
</div>
</div>

<!-- plate under the card: covers the whole purple block (its square
     corners would otherwise peek past the card's rounded corners) -->
<div id="cardplate" style="position:absolute;
     left:calc({{CARD_X}}px - 1px); top:calc({{CARD_Y}}px - 1px);
     width:calc({{CARD_W}}px + 2px); height:calc({{CARD_H}}px + 2px);
     background:#020202"></div>
<div id="cardmount">
<a class="ActorCard">
  <div class="ActorCard-body">
    <div class="ActorCard-header">
      <div class="ActorCard-iconWrap">
        <img class="ActorCard-icon" width="40" height="40" src="{{COMPANY_LOGO_URI}}" alt="">
      </div>
      <div class="ActorCard-titleWrap">
        <div class="ActorCard-titleRow">
          <h3 class="ActorCard-title">{{SPEAKER_NAME}}</h3>
        </div>
        <p class="ActorCard-slug">{{POSITION_COMPANY}}</p>
      </div>
    </div>
    <p class="ActorCard-desc">{{DESCRIPTION}}</p>
  </div>
  <div class="ActorCard-info">
    <div class="ActorCard-author">
      <!-- static on every generated card -->
      <img class="ActorCard-authorAvatar" width="20" height="20" src="{{HELP_ICON_URI}}" alt="">
      <!-- operator direction 2026-09-01: two extra spaces between the
           circle icon and the topic; the icon stays put, text moves right -->
      <p class="ActorCard-authorName">&nbsp;&nbsp;{{TOPIC_CATEGORY}}</p>
    </div>
    <div class="ActorCard-stats">
      <!-- DOM order [level][divider][duration]; row-reverse paints the star pair first -->
      <div class="ActorCard-stat">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" aria-hidden="true">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.667"
            d="M4.167 5.833a3.333 3.333 0 1 0 6.666 0 3.333 3.333 0 0 0-6.666 0M2.5 17.5v-1.667A3.333 3.333 0 0 1 5.833 12.5h3.334a3.333 3.333 0 0 1 3.333 3.333V17.5M13.333 2.608a3.333 3.333 0 0 1 0 6.459M17.5 17.5v-1.666a3.33 3.33 0 0 0-2.5-3.209"/>
        </svg>
        <p>{{LEVEL}}</p>
      </div>
      <div class="ActorCard-statDivider"></div>
      <div class="ActorCard-stat">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" aria-hidden="true">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.667"
            d="m10 14.792-5.143 2.704.982-5.728-4.167-4.056 5.75-.833 2.572-5.21 2.572 5.21 5.75.834-4.167 4.055.983 5.728z"/>
        </svg>
        <p>{{DURATION_MINUTES}}</p>
        <p>(mins)</p>
      </div>
    </div>
  </div>
</a>
</div>

</body>
</html>
